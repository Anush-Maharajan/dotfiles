[gaps]
# Reduce the spacing between windows (default is usually 8 or 10)
inner = 4
outer = 4

[border]
enable = true
width = 2
active_color = "#7aa2f7"

[border.inactive]
enable = false
width = 0

[window]
# Make window corners slightly rounded (value in pixels)
corner_radius = 8

[bar]
# Force the top bar/panel to stretch completely across the screen width
full_width = true
margin = 0
