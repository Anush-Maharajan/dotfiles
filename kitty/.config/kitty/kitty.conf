# ╔══════════════════════════════════════════════════════════════════════╗
# ║                          KITTY • CACHYOS                             ║
# ║                Tokyo Night / Noctalia • Optimized                    ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ─────────────────────────────────────────────────────────────────────
# FONT
# ─────────────────────────────────────────────────────────────────────

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size        11.5
force_subpixel_rendering yes
disable_ligatures never

# ─────────────────────────────────────────────────────────────────────
# TRANSPARENCY & WINDOW LAYOUT
# ─────────────────────────────────────────────────────────────────────

background_opacity         0.85
dynamic_background_opacity yes

window_padding_width       14
window_padding_height      12
single_window_padding_width 14

window_margin_width        0
single_window_margin_width -1

placement_strategy        center
remember_window_size      yes
remember_window_position  no
confirm_os_window_close   0

window_border_width       0
draw_minimal_borders      yes
active_border_color       #7aa2f7
inactive_border_color     #14161f

# ─────────────────────────────────────────────────────────────────────
# WAYLAND / DISPLAY
# ─────────────────────────────────────────────────────────────────────

linux_display_server      wayland
wayland_enable_ime        no

# ─────────────────────────────────────────────────────────────────────
# CURSOR & TRAIL EFFECT
# ─────────────────────────────────────────────────────────────────────

cursor_shape              beam
cursor_shape_unfocused    hollow

cursor_blink_interval     0.5
cursor_stop_blinking_after 10.0
cursor_beam_thickness     1.8

cursor_trail              3
cursor_trail_decay        0.1 0.4
cursor_trail_start_threshold 2
cursor_trail_color        #7aa2f7

# ─────────────────────────────────────────────────────────────────────
# TAB BAR
# ─────────────────────────────────────────────────────────────────────

tab_bar_edge              top
tab_bar_style             slant
tab_bar_align             left
tab_bar_min_tabs          2
tab_bar_show_new_tab_button no
tab_switch_strategy        previous

tab_activity_symbol       " 󰅐"
tab_title_max_length      28
tab_title_template        " {index}: {title} "

active_tab_foreground     #1a1b26
active_tab_background     #7aa2f7
active_tab_font_style     bold

inactive_tab_foreground   #a9b1d6
inactive_tab_background   #1f2335
inactive_tab_font_style   normal

tab_bar_background        #14161f
tab_bar_margin_color      #14161f
tab_bar_margin_width      6
tab_bar_margin_height     3 3

# ─────────────────────────────────────────────────────────────────────
# PERFORMANCE / RENDERING
# ─────────────────────────────────────────────────────────────────────

repaint_delay             14
input_delay               1
sync_to_monitor           yes

scrollback_lines          25000
wheel_scroll_min_lines    2
wheel_scroll_multiplier   2.5

# ─────────────────────────────────────────────────────────────────────
# TERMINAL BEHAVIOR
# ─────────────────────────────────────────────────────────────────────

term                      xterm-kitty
enable_audio_bell         no
visual_bell_duration      0

allow_hyperlinks          yes
url_style                 curly
open_url_with_default_browser yes

shell_integration         enabled
dynamic_title             yes

# ─────────────────────────────────────────────────────────────────────
# MOUSE & SELECTION
# ─────────────────────────────────────────────────────────────────────

mouse_hide_wait           2.0
copy_on_select            no
strip_trailing_spaces     smart
select_by_word_characters :@-./_~?&=%+#

# ─────────────────────────────────────────────────────────────────────
# LAYOUTS & KEYBINDINGS
# ─────────────────────────────────────────────────────────────────────

enabled_layouts           tall,stack,grid,horizontal

kitty_mod ctrl+shift

# Tabs
map kitty_mod+t           new_tab
map kitty_mod+q           close_tab
map kitty_mod+right       next_tab
map kitty_mod+left        previous_tab
map kitty_mod+.           move_tab_forward
map kitty_mod+,           move_tab_backward

map kitty_mod+1           goto_tab 1
map kitty_mod+2           goto_tab 2
map kitty_mod+3           goto_tab 3
map kitty_mod+4           goto_tab 4

# Windows
map kitty_mod+enter       launch --cwd=current
map kitty_mod+l           next_layout

map kitty_mod+shift+left  neighboring_window left
map kitty_mod+shift+right neighboring_window right
map kitty_mod+shift+up    neighboring_window up
map kitty_mod+shift+down  neighboring_window down

# Opacity Controls
map kitty_mod+o>up        set_background_opacity +0.05
map kitty_mod+o>down      set_background_opacity -0.05
map kitty_mod+o>r         set_background_opacity 0.80
map kitty_mod+o>1         set_background_opacity 1

# Reload Config
map kitty_mod+shift+f5    load_config_file

# Theme Import
include themes/noctalia.conf
