# ╔══════════════════════════════════════════════════════════════════════╗
# ║                         KITTY • CACHYOS                            ║
# ║              Tokyo Night • Smooth • Clean • Practical              ║
# ╚══════════════════════════════════════════════════════════════════════╝


# ─────────────────────────────────────────────────────────────────────
# FONT
# ─────────────────────────────────────────────────────────────────────

font_family              JetBrains Mono Nerd Font Mono
bold_font                JetBrains Mono Nerd Font Mono Bold
italic_font              JetBrains Mono Nerd Font Mono
bold_italic_font         JetBrains Mono Nerd Font Mono Bold

font_size                14.0


# ─────────────────────────────────────────────────────────────────────
# COLORS
# ─────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────
# HIGH-CONTRAST TOKYO NIGHT PALETTE
# ─────────────────────────────────────────────────────────────────────

foreground               #c0caf5
background               #14161f

cursor                   #c0caf5
cursor_text_color        #14161f

selection_foreground     #ffffff
selection_background     #3b4261


# BLACK
color0                    #30364d
color8                    #697394

# RED
color1                    #f7768e
color9                    #ff9aaa

# GREEN
color2                    #9ece6a
color10                   #b7f28a

# YELLOW
color3                    #e0af68
color11                   #f6cf8c

# BLUE
color4                    #7aa2f7
color12                   #9abaff

# MAGENTA
color5                    #bb9af7
color13                   #d0b5ff

# CYAN
color6                    #7dcfff
color14                   #97eaff

# WHITE
color7                    #a9b1d6
color15                   #d5dcff

# ─────────────────────────────────────────────────────────────────────
# TRANSPARENCY
# ─────────────────────────────────────────────────────────────────────

background_opacity          0.90
dynamic_background_opacity  yes


# ─────────────────────────────────────────────────────────────────────
# WINDOW
# ─────────────────────────────────────────────────────────────────────

window_padding_width       12
window_padding_height      10

single_window_padding_width 12

window_margin_width         0
single_window_margin_width  -1

placement_strategy          center

remember_window_size        yes
remember_window_position    no

confirm_os_window_close     0

window_border_width         0.5pt

active_border_color         #7aa2f7
inactive_border_color       #414868

inactive_text_alpha         0.78


# ─────────────────────────────────────────────────────────────────────
# WAYLAND
# ─────────────────────────────────────────────────────────────────────
# Keep auto so Kitty chooses the native backend appropriately.
# On your Wayland session this will use Wayland.

linux_display_server        auto

# If you do not use an IME, disabling this avoids an input-loop
# latency path on Wayland.
wayland_enable_ime          no


# ─────────────────────────────────────────────────────────────────────
# CURSOR
# ─────────────────────────────────────────────────────────────────────

cursor_shape                beam
cursor_shape_unfocused      hollow

cursor_blink_interval       0.6
cursor_stop_blinking_after  15

cursor_beam_thickness       1.5

cursor_trail                1
cursor_trail_decay          0.1 0.35
cursor_trail_start_threshold 2

cursor_trail_color          #7aa2f7


# ─────────────────────────────────────────────────────────────────────
# TAB BAR
# ─────────────────────────────────────────────────────────────────────

tab_bar_edge                top
tab_bar_style               powerline
tab_powerline_style         angled

tab_bar_align               left

tab_bar_min_tabs            2
tab_bar_show_new_tab_button no

tab_switch_strategy         previous

tab_activity_symbol         " ●"

tab_title_max_length        32
tab_title_template          "{index}: {title}"

# Active
active_tab_foreground       #1a1b26
active_tab_background       #7aa2f7
active_tab_font_style       bold

# Inactive
inactive_tab_foreground     #a9b1d6
inactive_tab_background     #24283b
inactive_tab_font_style     normal

tab_bar_background           #1a1b26
tab_bar_margin_color         #1a1b26

tab_bar_margin_width         4
tab_bar_margin_height        2 2


# ─────────────────────────────────────────────────────────────────────
# RENDERING / PERFORMANCE
# ─────────────────────────────────────────────────────────────────────
# These are deliberately conservative.
# Kitty itself recommends tuning these for latency/CPU balance rather
# than blindly minimizing the numbers.

repaint_delay                7
input_delay                  2
sync_to_monitor              yes

scrollback_lines             20000

wheel_scroll_min_lines       3
wheel_scroll_multiplier      3.0


# ─────────────────────────────────────────────────────────────────────
# TERMINAL BEHAVIOR
# ─────────────────────────────────────────────────────────────────────

term                         xterm-kitty

enable_audio_bell            no
visual_bell_duration         0

allow_hyperlinks             yes

url_style                    curly
open_url_with_default_browser yes


# ─────────────────────────────────────────────────────────────────────
# SHELL INTEGRATION
# ─────────────────────────────────────────────────────────────────────
# Keep this enabled. Kitty uses it for CWD/title awareness, prompt
# navigation, last-command output, clone-window behavior and smoother
# shell resizing.

shell_integration             enabled
dynamic_title                 yes


# ─────────────────────────────────────────────────────────────────────
# MOUSE / SELECTION
# ─────────────────────────────────────────────────────────────────────

mouse_hide_wait               3.0

copy_on_select                no
strip_trailing_spaces         smart

select_by_word_characters     :@-./_~?&=%+#


# ─────────────────────────────────────────────────────────────────────
# LAYOUTS
# ─────────────────────────────────────────────────────────────────────

enabled_layouts               tall,stack,grid,horizontal

window_resize_step_cells      2
window_resize_step_lines      2


# ─────────────────────────────────────────────────────────────────────
# KEYBOARD
# ─────────────────────────────────────────────────────────────────────

kitty_mod ctrl+shift


# ╭────────────────────────────────────────────────────────────────────╮
# │ TABS                                                               │
# ╰────────────────────────────────────────────────────────────────────╯

map kitty_mod+t new_tab
map kitty_mod+q close_tab

map kitty_mod+right next_tab
map kitty_mod+left previous_tab

map kitty_mod+. move_tab_forward
map kitty_mod+, move_tab_backward

map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9


# ╭────────────────────────────────────────────────────────────────────╮
# │ WINDOWS                                                            │
# ╰────────────────────────────────────────────────────────────────────╯

# New window in the current working directory
map kitty_mod+enter launch --cwd=current

# Cycle layouts
map kitty_mod+l next_layout

# Focus neighboring windows
map kitty_mod+shift+left neighboring_window left
map kitty_mod+shift+right neighboring_window right
map kitty_mod+shift+up neighboring_window up
map kitty_mod+shift+down neighboring_window down

# Move windows
map kitty_mod+ctrl+left move_window left
map kitty_mod+ctrl+right move_window right
map kitty_mod+ctrl+up move_window up
map kitty_mod+ctrl+down move_window down

# Resize
map kitty_mod+r start_resizing_window


# ╭────────────────────────────────────────────────────────────────────╮
# │ WINDOW MODES                                                       │
# ╰────────────────────────────────────────────────────────────────────╯

map kitty_mod+f11 toggle_fullscreen
map kitty_mod+f10 toggle_maximized


# ╭────────────────────────────────────────────────────────────────────╮
# │ CLIPBOARD                                                          │
# ╰────────────────────────────────────────────────────────────────────╯

map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard


# ╭────────────────────────────────────────────────────────────────────╮
# │ SHELL / SCROLLBACK                                                 │
# ╰────────────────────────────────────────────────────────────────────╯

map kitty_mod+h show_scrollback
map kitty_mod+shift+h show_last_command_output


# ╭────────────────────────────────────────────────────────────────────╮
# │ CONFIG                                                             │
# ╰────────────────────────────────────────────────────────────────────╯

map kitty_mod+shift+f5 load_config_file
map kitty_mod+shift+f6 debug_config


# ╭────────────────────────────────────────────────────────────────────╮
# │ OPACITY                                                            │
# ╰────────────────────────────────────────────────────────────────────╯

map kitty_mod+o>up set_background_opacity +0.05
map kitty_mod+o>down set_background_opacity -0.05
map kitty_mod+o>r set_background_opacity 0.82
map kitty_mod+o>1 set_background_opacity 1


# ╭────────────────────────────────────────────────────────────────────╮
# │ RESET                                                              │
# ╰────────────────────────────────────────────────────────────────────╯

map kitty_mod+delete clear_terminal reset active
