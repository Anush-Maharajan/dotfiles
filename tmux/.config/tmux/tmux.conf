unbind r
bind r source-file ~/.config/tmux/tmux.conf
unbind C-b
set -g prefix C-space
bind C-space send-prefix
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

set -g @continuum-restore 'on'
# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"

# # Configure Catppuccin
# set -g @catppuccin_flavor "macchiato"
# set -g @catppuccin_status_background "none"
# set -g @catppuccin_window_status_style "none"
# set -g @catppuccin_pane_status_enabled "off"
# set -g @catppuccin_pane_border_status "off"


# Gruvbox Material (medium, dark) palette, mapped to the names the status bar uses
set -g @thm_bg "#282828"
set -g @thm_mantle "#1d2021"
set -g @thm_surface_0 "#3c3836"
set -g @thm_surface_1 "#504945"
set -g @thm_overlay_0 "#7c6f64"
set -g @thm_rosewater "#d4be98"
set -g @thm_green "#a9b665"
set -g @thm_yellow "#d8a657"
set -g @thm_peach "#e78a4e"
set -g @thm_maroon "#ea6962"
set -g @thm_blue "#7daea3"
set -g @thm_teal "#89b482"

# Configure Online

# status left look and feel
set -g status-left-length 100
set -g status-left ""

# Fixed prefix toggle for v2.3.0 transparency
set -ga status-left "#[bg=default,fg=#{?client_prefix,#{@thm_yellow},#{@thm_green}},bold]  #S "

set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=default,fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=default,fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=default,fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""

# 1. Git Branch block (No separator line before it)
set -ga status-right "#[bg=default fg=#{@thm_green}] #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null)"

# 2. Middle divider line (Puts a clean line between git and date)
set -ga status-right "#[bg=default fg=#{@thm_overlay_0} none] │ "
set -ga status-right "#[bg=default,fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "
#
# Configure Tmux
set -g status-position top
set -g status-style "bg=default"
set -g status-justify "absolute-centre"
#
# Command mode clean background
set -g message-command-style "bg=#{@thm_mantle},fg=#{@thm_teal}"
set -g message-style "bg=#{@thm_mantle},fg=#{@thm_teal},bold"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=default fg=#{@thm_surface_1}"
setw -g pane-border-style "bg=default fg=#{@thm_mantle}"
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

# Inactive windows: Transparent background, subtle rosewater text
set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=default fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=default fg=#{@thm_peach}"
set -g window-status-activity-style "bg=default fg=#{@thm_surface_0}"
set -gF window-status-separator "#[bg=default fg=#{@thm_overlay_0}]│"


# allowto passthrough in tmux
set -g allow-passthrough  on

# Active window: Colored background but clean contrast text
set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_peach} fg=#{@thm_bg} bold"
run -b "~/.config/tmux/plugins/tpm/tpm"


source-file -q "$HOME/.config/tmux/themes/noctalia.conf"
set -g status-style "bg=default"
set -g window-status-style "bg=default fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=default fg=#{@thm_peach}"
set -g window-status-current-style "bg=#{@thm_peach} fg=#{@thm_bg} bold"
